[project]
name = "uridx"
dynamic = ["version"]
description = "uridx - Personal Reference Index"
authors = [
    { name = "Justyn Shull" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "typer>=0.12",
    "sqlite-vec>=0.1.6",
    "rich>=13",
    "fastembed>=0.8",
]

[project.scripts]
uridx = "uridx.cli.main:main"

[project.optional-dependencies]
dev = ["ruff"]
docling = ["docling>=2.66"]
pdf = ["pdfplumber>=0.10"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["TID253"]

[tool.ruff.lint.flake8-tidy-imports]
# Every uridx invocation imports cli/, so a module-level import there is paid by `--help`,
# by argument errors, and by every command whether it needs the module or not. These are the
# expensive ones; commands that need them import them in the function body instead.
banned-module-level-imports = [
    "httpx",
    "numpy",
    "pydantic",
    "rich",
    "sqlalchemy",
    "sqlmodel",
    "uridx.chunking",
    "uridx.db",
    "uridx.embeddings",
    "uridx.record",
    "uridx.search",
    "uridx.sync",
]

[tool.ruff.lint.per-file-ignores]
# The ban is only about keeping cli/ cheap to import; everything else may import freely.
"!**/uridx/cli/**" = ["TID253"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
